name = "mazenos"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# Exact origin of your Pages website, without trailing slash. Comma-separated if needed.
ALLOWED_ORIGINS = "https://mazenos.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "mazenos"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "TEMP"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = true
